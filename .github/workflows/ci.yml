name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: estateflow
          POSTGRES_PASSWORD: estateflow
          POSTGRES_DB: estateflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estateflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # App connects as the non-superuser estateflow_app role so RLS actually
      # filters (superusers/BYPASSRLS always bypass RLS). Migrations run as the
      # privileged owner via DATABASE_MIGRATION_URL.
      DATABASE_URL: postgresql://estateflow_app:estateflow_app@localhost:5432/estateflow?schema=public
      DATABASE_MIGRATION_URL: postgresql://estateflow:estateflow@localhost:5432/estateflow?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      ENCRYPTION_KEY: 0000000000000000000000000000000000000000000=
    steps:
      - uses: actions/checkout@v4

      # Version is taken from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @estateflow/api prisma:generate

      - name: Build shared package
        run: pnpm --filter @estateflow/shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations (incl. RLS policies + auth functions)
        # Run as the privileged owner so the SECURITY DEFINER auth_* functions
        # are owned by a role that bypasses RLS, and so CREATE ROLE works.
        run: pnpm --filter @estateflow/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_MIGRATION_URL }}

      - name: e2e tests (api)
        run: pnpm --filter @estateflow/api test:e2e
