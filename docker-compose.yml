services:
  postgres:
    # pgvector-enabled Postgres 16 image for inventory embeddings (FR-16/17, Task 9)
    image: pgvector/pgvector:pg16
    container_name: estateflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: estateflow
      POSTGRES_PASSWORD: estateflow
      POSTGRES_DB: estateflow
    ports:
      - '5432:5432'
    volumes:
      - estateflow_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U estateflow -d estateflow']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: estateflow-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - estateflow_redisdata:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  estateflow_pgdata:
  estateflow_redisdata:
